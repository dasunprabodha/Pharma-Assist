spring.application.name=prescription-reader
server.port=8080
# Uploads for Week 2 (photos are at most 10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# JSON uses snake_case field names (drug_name, scan_id, ...) to match the shared Item structure
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always
# Keep uploads in memory (default 0B writes every upload to a temp file) - the upload is never written to disk.
# Only with KEEP_IMAGES=true is the processed image of a *confirmed* list saved (logs/scan-images/, auto-deleted).
spring.servlet.multipart.file-size-threshold=11MB
